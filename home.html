<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ordini Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Sfondo animato nero/grigio */
        body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            animation: bgPulse 8s infinite alternate ease-in-out;
        }

        @keyframes bgPulse {
            0% { background-color: #000000; color: #ffffff; }
            50% { background-color: #111111; color: #f0f0f0; }
            100% { background-color: #1a1a1a; color: #ffffff; }
        }

        .dashboard-container {
            width: 100%;
            max-width: 500px; /* Ottimizzato per schermo telefono */
            background: #000000;
            border: 2px solid #ffffff;
            padding: 16px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-logout {
            padding: 6px 12px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-logout:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Metriche Statistiche Mobile */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            border: 1px dashed #ffffff;
            padding: 8px 4px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #aaaaaa;
        }

        .stat-card p {
            font-size: 0.95rem;
            font-weight: bold;
        }

        /* Controlli e Ricerca */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-action:hover {
            background-color: #cccccc;
        }

        /* Elenco Ordini a Schede */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-card {
            border: 1px solid #ffffff;
            background-color: #050505;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #333333;
            padding-bottom: 6px;
        }

        .order-id {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .status-badge {
            padding: 2px 6px;
            border: 1px solid #ffffff;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .order-body {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .order-thumb {
            width: 65px;
            height: 65px;
            border: 1px solid #ffffff;
            object-fit: cover;
            background-color: #111111;
            cursor: pointer;
            flex-shrink: 0;
        }

        .order-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.8rem;
            flex-grow: 1;
        }

        .order-details strong {
            color: #ffffff;
        }

        .taglia-badge {
            display: inline-block;
            border: 1px solid #888888;
            padding: 1px 4px;
            font-size: 0.7rem;
            margin-top: 2px;
            width: fit-content;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #333333;
            padding-top: 6px;
            margin-top: 2px;
        }

        .order-price {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .actions-group {
            display: flex;
            gap: 6px;
        }

        .btn-card {
            padding: 4px 8px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-card:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Modal Generica */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-content {
            background: #000000;
            border: 2px solid #ffffff;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            font-size: 1rem;
            margin-bottom: 14px;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75rem;
        }

        .form-group input, .form-group select {
            padding: 8px;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* Modal Foto Ingrandita */
        .photo-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .photo-modal img {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header Mobile -->
        <div class="header-bar">
            <h1>GESTIONE ORDINI</h1>
            <a href="index.html" class="btn-logout">ESCI</a>
        </div>

        <!-- KPI Sintetici Mobile -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>ORDINI</h3>
                <p id="total-orders">0</p>
            </div>
            <div class="stat-card">
                <h3>ATTIVI</h3>
                <p id="pending-orders">0</p>
            </div>
            <div class="stat-card">
                <h3>INCASSO</h3>
                <p id="total-revenue">0 €</p>
            </div>
        </div>

        <!-- Ricerca e Tasto Inserimento -->
        <div class="controls-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Cerca cliente, modello o taglia...">
            <button class="btn-action" id="btn-open-modal">+ NUOVO ORDINE</button>
        </div>

        <!-- Lista Ordini Mobile -->
        <div id="orders-list" class="orders-list">
            <!-- Schede caricate da JS -->
        </div>

    </div>

    <!-- MODAL NUOVO / MODIFICA ORDINE -->
    <div id="modal-ordine" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">NUOVO ORDINE</h2>
            <form id="form-ordine">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="form-group">
                    <label>CLIENTE:</label>
                    <input type="text" id="input-cliente" required placeholder="Nome Cognome">
                </div>
                <div class="form-group">
                    <label>MODELLO SCARPA:</label>
                    <input type="text" id="input-modello" required placeholder="Es. Oxford Royal Calfskin">
                </div>
                <div class="form-group">
                    <label>TAGLIA (EU):</label>
                    <input type="number" step="0.5" min="30" max="50" id="input-taglia" required placeholder="42">
                </div>
                <div class="form-group">
                    <label>IMPORTO (€):</label>
                    <input type="number" step="0.01" id="input-importo" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>CAMBIA/CARICA FOTO:</label>
                    <input type="file" id="input-foto" accept="image/*">
                </div>
                <div class="form-group">
                    <label>STATO ORDINE:</label>
                    <select id="input-stato">
                        <option value="IN LAVORAZIONE">IN LAVORAZIONE</option>
                        <option value="SPEDITO">SPEDITO</option>
                        <option value="COMPLETATO">COMPLETATO</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-action">SALVA</button>
                    <button type="button" class="btn-action" id="btn-close-modal" style="background:#000; color:#fff; border:1px solid #fff;">ANNULLA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL ANTEPRIMA FOTO GRANDE -->
    <div id="photo-modal" class="photo-modal" onclick="this.style.display='none'">
        <img id="full-image" src="" alt="Anteprima Scarpa">
    </div>

    <script>
        const defaultPhoto = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

        let ordini = [
            { id: "#ORD-1001", cliente: "Mario Rossi", modello: "Oxford Royal Calfskin", taglia: "42", importo: 650.00, stato: "SPEDITO", foto: defaultPhoto },
            { id: "#ORD-1002", cliente: "Giuseppe Verdi", modello: "Derby Suede Heritage", taglia: "43", importo: 580.00, stato: "IN LAVORAZIONE", foto: defaultPhoto },
            { id: "#ORD-1003", cliente: "Laura Bianchi", modello: "Pumps Silk 105", taglia: "38", importo: 790.00, stato: "IN LAVORAZIONE", foto: defaultPhoto }
        ];

        const ordersList = document.getElementById('orders-list');
        const searchInput = document.getElementById('search-input');
        const modal = document.getElementById('modal-ordine');
        const photoModal = document.getElementById('photo-modal');
        const fullImage = document.getElementById('full-image');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const formOrdine = document.getElementById('form-ordine');
        const editIndexInput = document.getElementById('edit-index');
        const modalTitle = document.getElementById('modal-title');

        // Render delle schede ordini
        function renderOrders() {
            ordersList.innerHTML = '';
            const filter = searchInput.value.toLowerCase();

            let totali = 0;
            let inLavorazione = 0;
            let incasso = 0;

            ordini.forEach((ord, index) => {
                const textSearch = `${ord.id} ${ord.cliente} ${ord.modello} ${ord.taglia} ${ord.stato}`.toLowerCase();
                if (filter && !textSearch.includes(filter)) return;

                totali++;
                if (ord.stato === "IN LAVORAZIONE") inLavorazione++;
                incasso += ord.importo;

                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-id">${ord.id}</span>
                        <span class="status-badge">${ord.stato}</span>
                    </div>
                    <div class="order-body">
                        <img src="${ord.foto}" class="order-thumb" onclick="apriFoto('${ord.foto}')" alt="Foto">
                        <div class="order-details">
                            <strong>${ord.cliente}</strong>
                            <span>${ord.modello}</span>
                            <span class="taglia-badge">TAGLIA: ${ord.taglia}</span>
                        </div>
                    </div>
                    <div class="order-footer">
                        <span class="order-price">${ord.importo.toFixed(2)} €</span>
                        <div class="actions-group">
                            <button class="btn-card" onclick="apriModifica(${index})">✎ MODIFICA</button>
                            <button class="btn-card" onclick="eliminaOrdine(${index})">ELIMINA</button>
                        </div>
                    </div>
                `;
                ordersList.appendChild(card);
            });

            document.getElementById('total-orders').textContent = totali;
            document.getElementById('pending-orders').textContent = inLavorazione;
            document.getElementById('total-revenue').textContent = Math.round(incasso) + ' €';
        }

        // Apri Modal per Modificare Ordine
        function apriModifica(index) {
            const ord = ordini[index];
            editIndexInput.value = index;
            modalTitle.textContent = "MODIFICA ORDINE " + ord.id;

            document.getElementById('input-cliente').value = ord.cliente;
            document.getElementById('input-modello').value = ord.modello;
            document.getElementById('input-taglia').value = ord.taglia;
            document.getElementById('input-importo').value = ord.importo;
            document.getElementById('input-stato').value = ord.stato;
            document.getElementById('input-foto').value = ""; // reset selezione file

            modal.style.display = 'flex';
        }

        // Apri Modal per Nuovo Ordine
        btnOpenModal.addEventListener('click', () => {
            editIndexInput.value = "-1";
            modalTitle.textContent = "NUOVO ORDINE";
            formOrdine.reset();
            modal.style.display = 'flex';
        });

        btnCloseModal.addEventListener('click', () => modal.style.display = 'none');

        // Salvataggio Ordine (Nuovo o Modificato)
        formOrdine.addEventListener('submit', (e) => {
            e.preventDefault();

            const idx = parseInt(editIndexInput.value);
            const fileInput = document.getElementById('input-foto');
            const file = fileInput.files[0];

            function salvaDati(fotoUrl) {
                if (idx === -1) {
                    // Creazione Nuovo Ordine
                    const nuovoId = "#ORD-" + (1001 + ordini.length + Math.floor(Math.random() * 50));
                    ordini.unshift({
                        id: nuovoId,
                        cliente: document.getElementById('input-cliente').value.trim(),
                        modello: document.getElementById('input-modello').value.trim(),
                        taglia: document.getElementById('input-taglia').value.trim(),
                        importo: parseFloat(document.getElementById('input-importo').value),
                        stato: document.getElementById('input-stato').value,
                        foto: fotoUrl || defaultPhoto
                    });
                } else {
                    // Aggiornamento Ordine Esistente
                    ordini[idx].cliente = document.getElementById('input-cliente').value.trim();
                    ordini[idx].modello = document.getElementById('input-modello').value.trim();
                    ordini[idx].taglia = document.getElementById('input-taglia').value.trim();
                    ordini[idx].importo = parseFloat(document.getElementById('input-importo').value);
                    ordini[idx].stato = document.getElementById('input-stato').value;
                    if (fotoUrl) {
                        ordini[idx].foto = fotoUrl; // aggiorna la foto solo se ne è stata caricata una nuova
                    }
                }

                renderOrders();
                modal.style.display = 'none';
            }

            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    salvaDati(reader.result);
                };
                reader.readAsDataURL(file);
            } else {
                salvaDati(null);
            }
        });

        // Elimina ordine
        function eliminaOrdine(index) {
            const ord = ordini[index];
            if (confirm(`Eliminare l'ordine ${ord.id} di ${ord.cliente}?`)) {
                ordini.splice(index, 1);
                renderOrders();
            }
        }

        // Mostra foto intera
        function apriFoto(src) {
            fullImage.src = src;
            photoModal.style.display = 'flex';
        }

        // Ricerca Live
        searchInput.addEventListener('keyup', renderOrders);

        // Caricamento Iniziale
        renderOrders();
    </script>

</body>
</html>
