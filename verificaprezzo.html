<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Prezzo</title>
    <link rel="stylesheet" href="style-verificaprezzo.css">
    <script src="verificaprezzo.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>VERIFICA PREZZO</h1>

        <div class="field-group">
            <label for="seleziona-modello">SELEZIONA MODELLO:</label>
            <input type="text" id="seleziona-modello" list="lista-modelli" placeholder="Cerca o seleziona..." autocomplete="off">
            
            <!-- ======================================================= -->
            <!-- 🟢 ZONA MODIFICABILE: LISTINO MODELLI                  -->
            <!-- Aggiungi o modifica le opzioni della lista qui sotto    -->
            <!-- ======================================================= -->
            <datalist id="lista-modelli">
                <option value="New Balance 9060"></option>
                <option value="Golden Goose"></option>
                <option value="Versache Chain"></option>
                <option value="Dolce & Gabbana"></option>
                <option value="Zanotti"></option>
                <option value="Rick Owens"></option>
                <option value="LV Skate"></option>
                <option value="LV Trainer"></option>
                <option value="McQueen"></option>
                <option value="Yeezy 350"></option>
                <option value="Jordan 4"></option>
                <option value="Dior B23"></option>
            </datalist>
            <!-- ======================================================= -->
        </div>

        <button id="btn-verifica">VERIFICA</button>

        <div id="risultato-prezzo" class="risultato-box">
            --.-- €
        </div>
    </div>

</body>
</html>
